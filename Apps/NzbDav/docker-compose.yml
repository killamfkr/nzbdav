name: nzbdav
services:
  nzbdav:
    cpu_shares: 90
    container_name: nzbdav
    deploy:
      resources:
        reservations:
          memory: "512M"
    environment:
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
    healthcheck:
      test: curl -f http://localhost:3000/health || exit 1
      interval: 1m
      retries: 3
      start_period: 30s
      timeout: 10s
    image: nzbdav/nzbdav:0.6.4
    labels:
      icon: https://cdn.jsdelivr.net/gh/killamfkr/nzbdav@main/Apps/NzbDav/icon.png
    networks:
      - nzbdav
    ports:
      - target: 3000
        published: "3000"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - /DATA/AppData/nzbdav/config:/config
      - /DATA/remote:/mnt/remote:rshared
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Time zone for logs and scheduled tasks.
        - container: PUID
          description:
            en_US: User ID that runs NzbDav inside the container.
        - container: PGID
          description:
            en_US: Group ID that runs NzbDav inside the container.
      ports:
        - container: "3000"
          description:
            en_US: NzbDav web UI and WebDAV port
      volumes:
        - container: /config
          description:
            en_US: NzbDav configuration and database.
        - container: /mnt/remote
          description:
            en_US: Rclone mount root (WebDAV files appear under /mnt/remote/nzbdav).
  nzbdav_rclone:
    cap_add:
      - SYS_ADMIN
    container_name: nzbdav_rclone
    cpu_shares: 90
    depends_on:
      nzbdav:
        condition: service_healthy
        restart: true
    devices:
      - /dev/fuse:/dev/fuse:rwm
    environment:
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
    image: rclone/rclone:1.74.3
    networks:
      - nzbdav
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    volumes:
      - /DATA/remote:/mnt/remote:rshared
      - /DATA/AppData/nzbdav/rclone.conf:/config/rclone/rclone.conf
    command: >-
      mount nzbdav: /mnt/remote/nzbdav
      --allow-other
      --links
      --use-cookies
      --vfs-cache-mode=full
      --vfs-cache-max-size=20G
      --vfs-cache-max-age=24h
      --buffer-size=0M
      --vfs-read-ahead=512M
      --dir-cache-time=20s
      --uid=1000
      --gid=1000
networks:
  nzbdav:
    driver: bridge
x-casaos:
  architectures:
    - amd64
    - arm64
  author: NzbDav
  category: Media
  description:
    en_US: |
      NzbDav is a WebDAV server that streams usenet content without local storage. This stack includes an Rclone sidecar that mounts the WebDAV share to /DATA/remote/nzbdav on your server for Radarr, Sonarr, and Plex.

      After install: configure NzbDav, then create /DATA/AppData/nzbdav/rclone.conf (see install guide).
  developer: NzbDav
  docs: https://github.com/killamfkr/nzbdav/blob/main/docs/casaos-install.md
  icon: https://cdn.jsdelivr.net/gh/killamfkr/nzbdav@main/Apps/NzbDav/icon.png
  index: /
  main: nzbdav
  port_map: "3000"
  repo: https://github.com/killamfkr/nzbdav
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/killamfkr/nzbdav@main/Apps/NzbDav/screenshot-1.png
  support: https://github.com/killamfkr/nzbdav/issues
  tagline:
    en_US: Stream usenet content over WebDAV without local storage
  tips:
    before_install:
      en_US: |
        Recommended: use the one-command installer instead of manual compose import:

        curl -fsSL https://raw.githubusercontent.com/killamfkr/nzbdav/main/scripts/install-casaos.sh | sudo bash

        It installs NzbDav + Rclone, generates rclone.conf, and configures everything automatically.
  title:
    en_US: NzbDav
  version: "0.6.4"
  website: https://github.com/killamfkr/nzbdav
