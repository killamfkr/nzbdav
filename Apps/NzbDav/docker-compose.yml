name: nzbdav
services:
  nzbdav:
    cpu_shares: 90
    container_name: nzbdav
    deploy:
      resources:
        reservations:
          memory: "512M"
    environment:
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
    healthcheck:
      test: curl -f http://localhost:3000/health || exit 1
      interval: 1m
      retries: 3
      start_period: 30s
      timeout: 10s
    image: nzbdav/nzbdav:0.6.4
    labels:
      icon: https://cdn.jsdelivr.net/gh/killamfkr/nzbdav@main/Apps/NzbDav/icon.png
    network_mode: bridge
    ports:
      - target: 3000
        published: "3000"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/nzbdav/config
        target: /config
      - type: bind
        source: /DATA/remote
        target: /mnt
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Time zone for logs and scheduled tasks.
        - container: PUID
          description:
            en_US: User ID that runs NzbDav inside the container.
        - container: PGID
          description:
            en_US: Group ID that runs NzbDav inside the container.
      ports:
        - container: "3000"
          description:
            en_US: NzbDav web UI and WebDAV port
      volumes:
        - container: /config
          description:
            en_US: NzbDav configuration and database.
        - container: /mnt
          description:
            en_US: Mount point for Rclone remote storage (used with Radarr/Sonarr).
x-casaos:
  architectures:
    - amd64
    - arm64
  author: NzbDav
  category: Media
  description:
    en_US: |
      NzbDav is a WebDAV server that lets you mount and browse NZB files as a virtual file system without downloading them first. It provides a SABnzbd-compatible API and integrates with Sonarr, Radarr, Plex, and Jellyfin.

      After installation, open the web UI to create your admin account, configure your usenet provider, and set WebDAV credentials.
  developer: NzbDav
  docs: https://github.com/killamfkr/nzbdav/blob/main/docs/setup-guide.md
  icon: https://cdn.jsdelivr.net/gh/killamfkr/nzbdav@main/Apps/NzbDav/icon.png
  index: /
  main: nzbdav
  port_map: "3000"
  repo: https://github.com/killamfkr/nzbdav
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/killamfkr/nzbdav@main/Apps/NzbDav/screenshot-1.png
  support: https://github.com/killamfkr/nzbdav/issues
  tagline:
    en_US: Stream usenet content over WebDAV without local storage
  tips:
    before_install:
      en_US: |
        After install, open the web UI and:
        1. Create your admin username and password
        2. Go to Settings → Usenet and enter your provider details
        3. Go to Settings → WebDAV and set a WebDAV username and password
  title:
    en_US: NzbDav
  version: "0.6.4"
  website: https://github.com/killamfkr/nzbdav
